version: 2
project_name: ycode
before:
  hooks:
    - go mod tidy
builds:
  - id: ycode
    main: ./cmd/ycode
    binary: ycode
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      # Version lives in package main, so the linker symbol is main.Version —
      # the full import path silently does nothing.
      - -X main.Version={{.Version}}
      - -X main.Commit={{.FullCommit}}
      - -X main.Date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
checksum:
  name_template: checksums.txt

# Keyless Sigstore signing of the checksum manifest. A checksum proves the
# download matches the release; the signature proves the checksum was produced
# by this repo's release pipeline. Both are needed to trust a binary.
#
# --bundle writes certificate, signature, and transparency log into one
# .sigstore.json, which is the form cosign v3 documents.
signs:
  - artifacts: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# Package managers. A cask (not a formula) is the correct shape here: these are
# pre-compiled, unsigned binaries, and Homebrew formulae are intended for
# source builds. `brews` still works but is soft-deprecated.
homebrew_casks:
  - repository:
      owner: Yash-K-Jagani
      name: homebrew-ycode
      token: "{{ .Env.HOMEBREW_TOKEN }}"
    name: ycode
    description: Terminal-first AI coding harness with a local-first agent loop
    homepage: https://github.com/Yash-K-Jagani/ycode
    binaries:
      - ycode
    hooks:
      post:
        # ycode is not codesigned or notarized, so Gatekeeper quarantines the
        # downloaded binary. Strip the attribute or every run prompts the user.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ycode"]
          end

scoops:
  - repository:
      owner: Yash-K-Jagani
      # Cannot be "ycode": that name is already taken by the main repo on the
      # same owner. See docs/distribution.md.
      name: ycode-scoop
    description: Terminal-first AI coding harness with a local-first agent loop
    homepage: https://github.com/Yash-K-Jagani/ycode
    license: MIT
    # Manifests go in the repo root on purpose: scoop bucket list reports 0
    # manifests when they are nested in a subdirectory.
    directory: ""

winget:
  - repository:
      owner: microsoft
      name: winget-pkgs
      pull_request:
        enabled: true
        # winget-pkgs rejects direct pushes; every manifest lands as a PR.
        draft: true
    # PackageIdentifier defaults to <publisher>.<name>, i.e. Yash-K-Jagani.ycode.
    # NOTE: the publisher must already be registered in winget-pkgs, otherwise
    # the PR is rejected. See docs/distribution.md.
    publisher: Yash-K-Jagani
    publisher_url: https://github.com/Yash-K-Jagani
    publisher_support_url: https://github.com/Yash-K-Jagani/ycode/issues
    license: MIT
    license_url: https://github.com/Yash-K-Jagani/ycode/blob/main/LICENSE
    homepage: https://github.com/Yash-K-Jagani/ycode
    # winget-pkgs CI enforces hard length limits: 80 and 101 characters.
    # scripts/test-manifest-limits.sh guards these.
    short_description: Terminal-first AI coding harness with a local-first agent loop
    description: Single-binary terminal coding assistant with a real agent tool loop.
    tags:
      - cli
      - ai
      - terminal

snapshot:
  version_template: "{{ .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
release:
  github:
    owner: Yash-K-Jagani
    name: ycode
