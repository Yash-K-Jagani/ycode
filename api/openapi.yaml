openapi: 3.0.3
info:
  title: ycode local API
  version: 0.13.0
servers:
  - url: http://localhost:8471
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Token printed by `ycode serve`, or from ~/.ycode/api_token, or
        YCODE_API_TOKEN. Required for any non-loopback bind; optional (but
        recommended) on 127.0.0.1. Also accepted as X-Ycode-Token or ?token=.
paths:
  /healthz:
    get:
      summary: Liveness (never requires a token)
      security: []
      responses:
        '200':
          description: ok
  /v1/models:
    get:
      summary: Installed Ollama models + cloud catalog
      responses:
        '200':
          description: model lists
  /v1/status:
    get:
      summary: Active provider/model, cost today, latency
      responses:
        '200':
          description: status
  /v1/chat:
    post:
      summary: Headless turn (tools in build/goal/plan modes; goal loops until done)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string }
                # Keep in step with internal/modes specs (names are derived
                # from that table; modes_test.go asserts the two agree).
                mode: { type: string, enum: [plan, goal, build, chat, thinking] }
                agent: { type: string }
                workdir: { type: string }
                goal_iters: { type: integer, description: goal mode only: max autonomous iterations }
      responses:
        '200':
          description: answer
